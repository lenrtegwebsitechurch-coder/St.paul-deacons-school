function gsum(sid,ids,items){const r=rec(sid),bp=r.m.filter(z=>z.p).length*0.5;let s=0,m=0;items.forEach(x=>{if(ids&&!ids.includes(x.id))return;m+=+x.m||0;const v=isBonus(x)?bp:parseFloat(r.sc[x.id]);if(!isNaN(v))s+=v});return{s:Math.round(s*100)/100,m,p:m?Math.round(s/m*1000)/10:0}}
function sumRows(sid,it,gr){const rows=[['المجموع الكلي',null],...gr.map(g=>[g.t,g.ids])];return`<div style="margin-top:10px;border-top:1px solid var(--bd);padding-top:8px"><b>المجاميع والنسب</b>${rows.map(([t,ids])=>{const a=gsum(sid,ids,it);return`<div class="row"><span>${esc(t)}</span><span><b>${a.s}</b> / ${a.m} — <b>${a.p}%</b></span></div>`}).join('')}<div class="mu">اللحن اللي مفيهوش درجة بيتحسب صفر.</div></div>`}
function groupsCard(y,it,l,e){if(!it.length)return'';const gr=ggr['y'+y]||[],cur=gr.find(g=>g.id===S.gg)||null;
return`<div class="c"><h2>📊 قوائم المجاميع والنسب</h2>${gr.map(g=>`<div class="row"><div style="flex:1;min-width:0"><b>${esc(g.t)}</b><div class="mu">${g.ids.map(i=>esc((it.find(x=>x.id===i)||{}).t||'')).filter(Boolean).join('، ')}</div></div>${e?`<button class="d" onclick="grDel('${g.id}')">حذف</button>`:''}</div>`).join('')||'<div class="mu">لسه مفيش قوايم. اعمل قايمة بالألحان اللي عايز تجمع درجاتها.</div>'}
${e?`<h2>قايمة جديدة</h2><input id="gn" placeholder="اسم القايمة (مثال: ألحان الميلاد)"><div class="mu">اختار الألحان اللي هتتجمع:</div>${it.map(x=>`<label class="row" style="cursor:pointer"><span>${esc(x.t)} <span class="mu">(من ${esc(x.m)})</span></span><input type="checkbox" class="gk" value="${x.id}" style="width:24px;height:24px;flex:none;margin:0"></label>`).join('')}<button onclick="grAdd()">إنشاء القايمة</button>`:''}
<h2>نتيجة السنة</h2><select onchange="S.gg=this.value;render()"><option value="">المجموع الكلي (كل الألحان)</option>${gr.map(g=>`<option value="${g.id}" ${S.gg===g.id?'selected':''}>${esc(g.t)}</option>`).join('')}</select>${l.map(s=>{const a=gsum(s.id,cur?cur.ids:null,it);return`<div class="row"><span>${esc(s.name)}</span><span><b>${a.s}</b> / ${a.m} — <b>${a.p}%</b></span></div>`}).join('')}<div class="mu">اللحن اللي مفيهوش درجة بيتحسب صفر.</div></div>`}
function grAdd(){const t=$('#gn').value.trim(),ids=[...document.querySelectorAll('.gk:checked')].map(x=>x.value);if(!t)return toast('اكتب اسم القايمة');if(!ids.length)return toast('اختار لحن واحد على الأقل');const gr=JSON.parse(JSON.stringify(ggr['y'+S.year]||[]));gr.push({id:'r'+Date.now().toString(36),t,ids});put('gitems','y'+S.year,{items:JSON.parse(JSON.stringify(gitems['y'+S.year]||[])),groups:gr}).then(()=>{const x=$('#gn');if(x)x.value=''})}
function grDel(id){put('gitems','y'+S.year,{items:JSON.parse(JSON.stringify(gitems['y'+S.year]||[])),groups:(ggr['y'+S.year]||[]).filter(g=>g.id!==id).map(g=>({...g}))});if(S.gg===id)S.gg=''}

function scRow(st,x,e){if(isBonus(x)){const bp=rec(st.id).m.filter(z=>z.p).length*0.5;return`<div class="row"><span>${esc(x.t)}</span><span style="display:flex;align-items:center;gap:8px;flex:none"><b>${bp}</b><span class="mu">⭐ تلقائي من حضور القداس</span></span></div>`}return`<div class="row"><span>${esc(x.t)}</span><span style="display:flex;align-items:center;gap:8px;flex:none">${e?`<input type="number" style="width:84px;margin:0" value="${esc(rec(st.id).sc[x.id]??'')}" onchange="scSet('${st.id}','${x.id}',this.value)">`:`<b>${esc(rec(st.id).sc[x.id]??'—')}</b>`}<span class="mu">من ${esc(x.m)}</span></span></div>`}
function entryList(st,it,gr,e){const used=new Set();gr.forEach(g=>g.ids.forEach(i=>used.add(i)));const sep='<div style="height:3px;border-radius:3px;background:linear-gradient(90deg,var(--g1),var(--g2));margin:14px 0"></div>',tot=(t,a)=>`<div class="row" style="background:rgba(227,189,106,.15);border-radius:10px;padding:8px"><b>${t}</b><span><b>${a.s}</b> / ${a.m} — <b>${a.p}%</b></span></div>`;let o='';
gr.forEach(g=>{const its=it.filter(x=>g.ids.includes(x.id));if(!its.length)return;o+=`<div style="margin-top:6px"><b style="color:var(--ac)">${esc(g.t)}</b></div>`+its.map(x=>scRow(st,x,e)).join('')+tot((/^مجموع/.test(g.t)?'':'مجموع ')+esc(g.t),gsum(st.id,g.ids,it))+sep});
const rest=it.filter(x=>!used.has(x.id));if(rest.length)o+=(gr.length?`<div style="margin-top:6px"><b style="color:var(--ac)">ألحان أخرى</b></div>`:'')+rest.map(x=>scRow(st,x,e)).join('')+(gr.length?sep:'');
return o+tot('المجموع الكلي',gsum(st.id,null,it))+'<div class="mu">اللحن اللي مفيهوش درجة بيتحسب صفر.</div>'}

function vTop(){const y=S.year,it=gitems['y'+y]||[],gr=ggr['y'+y]||[],cur=gr.find(g=>g.id===S.tg)||null,l=students.filter(s=>+s.year===y);
const rows=l.map(s=>({s,a:gsum(s.id,cur?cur.ids:null,it)})).sort((p,q)=>q.a.p-p.a.p||p.s.name.localeCompare(q.s.name,'ar'));let rk=0,pv=null;rows.forEach((r,i)=>{if(pv===null||r.a.p!==pv)rk=i+1;r.rk=rk;pv=r.a.p});
const nm=n=>n===1?'الأول':n===2?'الثاني':n===3?'الثالث':n;
return chips()+`<div class="c"><h2>🏆 الأوائل - ${yl(y)}</h2>${it.length?`<select onchange="S.tg=this.value;render()"><option value="">المجموع الكلي (كل الألحان)</option>${gr.map(g=>`<option value="${g.id}" ${S.tg===g.id?'selected':''}>${esc(g.t)}</option>`).join('')}</select>`:''}${!it.length?'<div class="mu">مفيش درجات للسنة دي لسه.</div>':rows.map(r=>{const ok=r.a.p>=60,has=r.a.s>0;return`<div class="tp"><div class="rk${has&&r.rk<=3?' t'+r.rk:''}">${has?nm(r.rk):'—'}</div><div class="tn">${esc(r.s.name)}<div class="bar"><i style="width:${Math.min(100,r.a.p)}%;background:${ok?'#1f8a54':'#c2392f'}"></i></div></div><div class="pc ${ok?'g':'r'}">${r.a.p}%</div></div>`}).join('')}<div class="mu">أخضر = 60% أو أكتر، أحمر = أقل من 60%.</div></div>`}

function hSave(i){const a=JSON.parse(JSON.stringify(hymns['y'+S.year]||[])),t=$('#he1').value.trim();if(!t)return toast('اكتب اسم اللحن');a[i]={...a[i],t,s:$('#he2').value.trim()||'عام',n:$('#he3').value.trim()};put('hymns','y'+S.year,{items:a}).then(ok=>{if(ok){S.he=0;S.pk=S.year+'|'+a[i].s;S.pi=String(i)}render()})}
</script></body></html>
